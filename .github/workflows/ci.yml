name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    uses: hyperb1iss/shared-workflows/.github/workflows/bun-ci.yml@e37ea32677f7135df04380afe5366063d416212a
    with:
      bun-version: "1.4.0"
